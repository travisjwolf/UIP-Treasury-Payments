<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fixture-driven payment repair operations view" />
    <title>Payment Operations Control Tower</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Treasury payments · fixture-driven operating view</p>
        <h1>Payment Operations Control Tower</h1>
      </div>
      <p class="health">● 40 cases · sandbox effectors · no payment writes</p>
    </header>
    <main>
      <section class="panel" aria-labelledby="queue-title">
        <div class="panel-head">
          <div><h2 id="queue-title">Repair queue</h2><p id="queue-summary" class="muted"></p></div>
          <nav class="pagination" aria-label="Queue pages">
            <button id="previous-page" type="button">Previous</button>
            <span id="page-label"></span>
            <button id="next-page" type="button">Next</button>
          </nav>
        </div>
        <div id="queue" class="queue" aria-live="polite"></div>
      </section>
      <aside class="panel" aria-labelledby="detail-title">
        <div class="panel-head"><h2 id="detail-title">Case detail</h2><span id="case-status" class="badge"></span></div>
        <div id="detail" class="detail"><p>Loading fixture cases…</p></div>
      </aside>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
